name: iCloud Container Setup

# One-off: create iCloud.com.headwind.app and assign it to the App ID
# via the ASC API key. Container creation isn't in Apple's documented
# API; this probes the endpoints Xcode's own provisioning service uses.
# Safe to re-run: every step is additive or read-only, and 4xx responses
# are logged, not fatal, until the final verification.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create and assign container
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip3 install --quiet pyjwt cryptography
          python3 scripts/setup-icloud-container.py
